name: Unit tests

# Gated on Build rather than triggered directly: a commit that doesn't compile
# has nothing worth testing, and running anyway would report a second failure
# for the same cause.
on:
  workflow_run:
    workflows: ["Build"]
    types:
      - completed

concurrency:
  group: ${{ github.workflow }}-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: true

jobs:
  unit:
    name: Unit tests
    # `workflow_run` fires however the upstream run ended, so the outcome has to
    # be checked here or a failed build would still run the tests.
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          # `workflow_run` starts from the default branch, so the commit the
          # build actually passed on has to be named explicitly.
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24.15.0
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run unit tests
        run: pnpm test
