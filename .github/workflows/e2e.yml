name: E2E tests

# Gated on Build rather than triggered directly: a commit that doesn't compile
# has nothing worth testing, and these tests send real mail through Resend.
on:
  workflow_run:
    workflows: ["Build"]
    types:
      - completed

concurrency:
  group: ${{ github.workflow }}-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: true

jobs:
  e2e:
    name: End-to-end tests
    # `workflow_run` fires however the upstream run ended, so the outcome has to
    # be checked here or a failed build would still burn Resend quota.
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          # `workflow_run` starts from the default branch, so the commit the
          # build actually passed on has to be named explicitly.
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24.15.0
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium

      - name: Run end-to-end tests
        run: pnpm test:e2e
        env:
          # The suite sends through Resend for real. `CONTACT_TO_EMAIL` is set
          # by playwright.config.ts to `delivered@resend.dev`, Resend's test
          # recipient, so a confirmed send never reaches a real inbox.
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          CONTACT_FROM_EMAIL: ${{ secrets.CONTACT_FROM_EMAIL }}

      - name: Upload report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
